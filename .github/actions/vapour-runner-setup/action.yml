name: "Runner and Shared Script Setup"
description: "Creates /data, clones a revision-pinned script repository, and installs shared host prerequisites."
inputs:
  pinned-rev:
    description: "Optional script repository commit to pin downstream jobs to."
    required: false
    default: ""
outputs:
  rev:
    description: "Resolved commit SHA of VapourScriptAddr."
    value: ${{ steps.bootstrap.outputs.rev }}
runs:
  using: composite
  steps:
    - name: "🧹 Maximize space and create /data lockfile"
      shell: bash
      run: |
        set -euo pipefail
        bash "${GITHUB_WORKSPACE}/scripts/x02.maximizeSpace.sh"
        test -f /data/.maximized.lock
    - name: "📦 Shallow-clone the pinned shared scripts"
      id: bootstrap
      uses: ./.github/actions/vapour-bootstrap
      with:
        pinned-rev: ${{ inputs.pinned-rev }}
    - name: "🧰 Install host utilities"
      shell: bash
      run: bash /data/scripts/x03.workflowSetup.sh host-utils
    - name: "🧩 Apply validated environment overrides"
      shell: bash
      run: bash /data/scripts/x03.workflowSetup.sh custom-envs
