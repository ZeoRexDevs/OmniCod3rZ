name: vapourCoderZv5a

run-name: "v5a Sample Q${{ inputs.QScale }} - ${{ inputs.Encod3r }} P${{ inputs.EncPreset }} - ${{ inputs.EpLabel }} ${{ inputs.ShowName }}"

on:
  workflow_dispatch:
    inputs:
      ShowName:
        description: "Show key from scripts/x01.showList.txt, or a compatible custom title"
        required: true
        type: string
      EpLabel:
        description: "Episode label such as S01E01 or EpFull"
        required: true
        type: string
        default: "S01E01"
      Encod3r:
        description: "Encoder binary family"
        required: true
        type: choice
        options: ["SVT", "AOM", "265"]
        default: "SVT"
      EncPreset:
        description: "Identical encoder preset for all four v5a sample runs"
        required: true
        type: string
        default: "4"
      QScale:
        description: "Trial QScale/CRF; use distinctive values for v5a, then base QScale path for v5b"
        required: true
        type: string
        default: "35"
      VidRes:
        description: "Output height (720p/1080p) or explicit WxH (1280x720)"
        required: true
        type: string
        default: "720p"
      TargetQuality:
        description: "Target per-scene SSIMU2 score (used by v5a optimizer)"
        required: false
        type: number
        default: 70
      ForceRecode:
        description: "Force re-encoding even when encoded scene already exists"
        required: false
        type: boolean
        default: false
      CustomEnvs:
        description: "Pipe-separated overrides: FILTERGRAPH=false|runID4localVS=123456789|runID4SCArt=123456789|runID4Flt=123456789|runID4Art=123456789|runID4SSArt=SELF|runID4ZFile=123456789"
        required: false
        type: string
      ScoreMethod:
        description: "Per-scene score implementation available in architect-v3"
        required: false
        type: choice
        options: ["vszip", "v2_zig"]
        default: "vszip"

jobs:
  v5a:
    name: "🧪 Per-scene quality sample run"
    uses: ./.github/workflows/vapourCore.yml
    with:
      ShowName: ${{ inputs.ShowName }}
      EpLabel: ${{ inputs.EpLabel }}
      Mode: "sample"
      Encod3r: ${{ inputs.Encod3r }}
      EncPreset: ${{ inputs.EncPreset }}
      QScale: ${{ inputs.QScale }}
      VidRes: ${{ inputs.VidRes }}
      TargetQuality: ${{ inputs.TargetQuality }}
      ForceRecode: ${{ inputs.ForceRecode }}
      CustomEnvs: ${{ inputs.CustomEnvs }}
      ScoreMethod: ${{ inputs.ScoreMethod }}
    secrets: inherit
