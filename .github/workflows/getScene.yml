name: getScene
run-name: "🎬 SceneDetect — ${{ inputs.ShowName }} @ ${{ inputs.EpLabels }}"

on:
  workflow_dispatch:
    inputs:
      ShowName:
        description: "Title key from scripts/x01.showList.txt"
        required: true
        type: string
      EpLabels:
        description: "One or more labels separated by '+', e.g. S01E01+S01E02 or EpFull"
        required: true
        type: string
        default: "S01E01"
      CustomEnvs:
        description: "Optional pipe-separated overrides, e.g. minSCLenth=36|Probe=false|SCDebug=true"
        required: false
        type: string
        default: ""

env:
  StateZ: SCD
  ShowName: ${{ inputs.ShowName }}
  EpLabels: ${{ inputs.EpLabels }}
  CustomEnvs: ${{ inputs.CustomEnvs }}
  RCLONE_CONFIG_HASH: ${{ secrets.RCLONE_CONFIG_HASH }}
  VapourScriptAddr: ${{ vars.VAPOUR_SCRIPT_ADDR }}
  PrimaryGDriveRoot: "gdrive_2tb:"
  SecondaryGDriveRoot: "gdrive_5th:"
  VapourDockerImage: "fr3akyphantom/architect-v3"
  SafeDockerTag: latest

jobs:
  get-scene:
    name: "🔎 Detect scenes and split FFV1"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: "🧰 Prepare runner and clone shared scripts"
        uses: ./.github/actions/vapour-runner-setup
      - name: "🔐 Configure rclone remotes"
        run: bash /data/scripts/x00.rcloneSetup.sh
      - name: "📥 Reuse a previous runtime artifact when runID4localVS is supplied"
        if: env.runID4localVS != ''
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: localVS.tar.gz
          path: /data/
          github-token: ${{ secrets.GH_TOKEN }}
          run-id: ${{ env.runID4localVS }}
      - name: "🐳 Restore previous runtime cache when present"
        id: runtime_cache
        run: bash /data/scripts/x54.runtimeCache.sh restore
      - name: "🐳 Login to Docker Hub"
        if: steps.runtime_cache.outputs.loaded != 'true'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: "🐳 Pull runtime image only when cache is unavailable"
        if: steps.runtime_cache.outputs.loaded != 'true'
        run: docker pull --platform linux/amd64 "${VapourDockerImage}:${SafeDockerTag}"
      - name: "📦 Save runtime image for reuse by later runs"
        run: bash /data/scripts/x54.runtimeCache.sh save
      - name: "📤 Upload runtime cache file without re-archiving"
        uses: actions/upload-artifact@v7.0.2
        with:
          path: /data/localVS.tar.gz
          archive: false
          retention-days: 6
      - name: "🐳 Start the scene-detection container"
        working-directory: /data
        env:
          jobIdentifier: scdetector
        run: bash /data/scripts/x53.dockerPrep.sh
      - name: "🎞️ Detect scenes, reuse the LWLibavSource cache, and upload scene chunks"
        working-directory: /data
        run: bash /data/scripts/x09.sceneDetector.sh
